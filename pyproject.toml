[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-buyer-journey"
version = "0.5.3"
requires-python = ">=3.11"
dependencies = ["flask>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
laya = ["laya"]
qwen-embed = ["sentence-transformers>=4.1"]
qwen-chat = ["transformers>=4.51","torch","accelerate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
