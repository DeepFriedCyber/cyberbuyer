[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-buyer-journey"
version = "0.5.8"
requires-python = ">=3.11"
dependencies = ["flask>=3,<4"]

[project.optional-dependencies]
jina-rerank = ["transformers>=4.51", "torch", "numpy"]
dev = ["pytest>=8,<9"]
laya = ["laya"]
qwen-embed = ["sentence-transformers>=4.1"]
qwen-chat = ["transformers>=4.51","torch","accelerate"]
nli = ["transformers>=4.51","torch","sentencepiece"]

[tool.pytest.ini_options]
pythonpath = ["src"]
