<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Vendor Insights</title><link rel=stylesheet href=/static/app.css></head><body><header><b>Vendor Insights</b><nav><a href=/>Buyer</a><a href=/insights>Vendor Insights</a></nav></header><main><section class=hero><h1>What buyers are trying to understand.</h1><p>Anonymous question intelligence. No buyer identity is collected.</p></section><div class=metrics><div class=metric><b id=total>0</b><span>Questions</span></div><div class=metric><b id=coverage>0%</b><span>Knowledge coverage</span></div><div class=metric><b id=unsupported>0</b><span>Unsupported</span></div></div><section class=panel><h2>Content gaps</h2><table><thead><tr><th>Buyer question</th><th>Times asked</th><th>Coverage</th><th>Opportunity</th></tr></thead><tbody id=gaps></tbody></table></section></main><script>const E=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));fetch("/api/insights").then(r=>r.json()).then(x=>{total.textContent=x.total_questions;coverage.textContent=x.coverage_pct+"%";unsupported.textContent=x.unsupported;gaps.innerHTML=x.gaps.length?x.gaps.map(g=>`<tr><td>${E(g.question)}</td><td>${g.count}</td><td class=gap>No approved answer</td><td>Create/approve FAQ, answer or explainer</td></tr>`).join(""):`<tr><td colspan=4>No gaps yet. Ask an unsupported question in Buyer view.</td></tr>`})</script></body></html>
